services:
  # 1. Express Backend Web Service (Listens on Render's default port 10000)
  - type: web
    name: lms-backend-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true # Generates a secure, cryptographically random JWT secret automatically
      - key: MONGO_URI
        value: mongodb+srv://admin:LmsAdmin2026@cluster0.mongodb.net/lms_production_db

  # 2. Next.js Frontend Web Service (Listens on Render's default port 10000)
  - type: web
    name: lms-frontend-client
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: lms-backend-api
          type: web
          property: host
